method: bayes
metric:
  name: train/loss
  goal: minimize

parameters:
  training_dataset:
    value: "TinyStories"

  # Model architecture parameters
  model:
    parameters:
      d_model:
        values: [256, 512]
      num_heads:
        values: [4, 8, 16]
      d_ff:
        values: [1024, 2048]
      rope_theta:
        value: 10000.0
      vocab_size:
        value: 10000
      context_length:
        value: 256
      num_layers:
        values: [4, 6, 8]
      checkpoint_folder:
        value: "checkpoints"

  # Optimizer hyperparameters
  optimizer:
    parameters:
      lr:
        distribution: log_uniform_values
        min: 1.0e-5
        max: 1.0e-3
      beta_1:
        value: 0.9
      beta_2:
        values: [0.95, 0.98, 0.99]
      weight_decay:
        distribution: uniform
        min: 0.01
        max: 0.1
      eps:
        value: 1.0e-8
      min_lr:
        value: 1.0e-6

  # Training loop parameters
  training:
    parameters:
      batch_size:
        values: [32, 64]
      seed:
        value: 42
      total_step_count:
        value: 5000
      warmup_steps:
        value: 500
      max_l2_norm:
        value: 1.0
      save_every:
        value: 1000
      log_every:
        value: 50