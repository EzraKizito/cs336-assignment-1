method: random
metric:
  name: train/loss
  goal: minimize

parameters:
  data:
    parameters:
      dataset_path:
        value: "data/encoded/tinystories.dat"
  checkpoint_folder:
    value: "checkpoints"
  name:
    value: "LR-Tuning"
  model:
    parameters:
      d_model:
        value: 512
      num_heads:
        value: 16
      d_ff:
        value: 1344
      rope_theta:
        value: 10000.0
      vocab_size:
        value: 10000
      context_length:
        value: 256
      num_layers:
        value: 4

  optimizer:
    parameters:
      lr:
        distribution: log_uniform_values
        min: 1.0e-5
        max: 1.0
      beta_1:
        value: 0.9
      beta_2:
        value: 0.99
      weight_decay:
        value: 0.01
      eps:
        value: 1.0e-8
      min_lr:
        value: 1.0e-6

  training:
    parameters:
      batch_size:
        value: 32
      seed:
        value: 42
      total_step_count:
        value: 2000
      warmup_steps:
        value: 100
      max_l2_norm:
        value: 1.0
      save_every:
        value: 0
      log_every:
        value: 0